 <p><font face=Arial>Mrs Doyle is played by Pauline McLynn and is the
 priests' house keeper. She ensures that no one leaves the parochial house
 without a grand cup of tea and some sandwiches. Mrs Doyle has a habit of
 habit falling off window sills - she cleans the parochial house windows in
 most episodes; incidentally they are always later broken as Father Jack
 dives through them due to the DRINK!</font></p>
