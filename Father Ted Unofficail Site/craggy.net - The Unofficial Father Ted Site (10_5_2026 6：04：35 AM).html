 <p><font face=Arial>The TV programme 'Father Ted' shown on Channel 4, is
 a sitcom set on the fictious 'Craggy Island' set off the west coast of
 Ireland. There are three main priests on the Island, <a href=http://www.users.globalnet.co.uk/~warden/craggy/ted.htm>Father
 Ted Crilly</a>, <a href=http://www.users.globalnet.co.uk/~warden/craggy/doug.htm>Father Dougal McGuire</a> and
 <a href=http://www.users.globalnet.co.uk/~warden/craggy/jack.htm>Father Jack Hackett</a>, which have been banished
 there because of their failings in the priesthood. Also on the island is
 their housekeeper <a href=http://www.users.globalnet.co.uk/~warden/craggy/doyle.htm>Mrs Doyle</a>. Nothing really
