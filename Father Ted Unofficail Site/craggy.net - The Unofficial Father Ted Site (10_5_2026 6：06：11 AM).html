 <p><u><font face=&quot;Comic Sans MS&quot; color=%23FF0000 size=+1>Series One</font></u></p>
 
 <p><font face=&quot;Comic Sans MS&quot; color=%23008000>Episode One -
 <font color=%230080C0>Good Luck Father Ted</font></font>
 <font face=Arial></font></p>
 
 <p><font face=Arial> Ted is on TV when interviewed by a magazine
 programme. But 'FunLand', the most pathetic travelling fair ever invented
 has come to Craggy Island, and while Ted is distracted with Father Jack,
 Dougal seizes his moment of glory. </font></p>
 
 <p><font face=&quot;Comic Sans MS&quot; color=%23008000>Episode Two -
 <font color=%230080C0>Entertaining Father Stone</font></font></p>
 
 <p align=LEFT><font face=Arial>Father Stone, perhaps the most boring
 priest ever comes to stay on Craggy Island. After his worst ever birthday
 party, Father Ted prays for deliverance from Father Stone, but a lightning
 strike wasn't what he expected.</font></p>
 
 <p><font face=&quot;Comic Sans MS&quot; color=%23008000>Episode Three -
 <font color=%230080C0>The Passion Of St Tibulus </font></font></p>
 
 <p align=LEFT><font face=Arial>Ted and Dougal are ordered by Bishop
 Brennan to protest against and X-rated film condemned by the church.
 However, their protest only draws more attention to the film, which
 becomes an instant success!</font></p>
 
 <p><font face=&quot;Comic Sans MS&quot; color=%23008000>Episode Four -
 <font color=%230080C0>Competition Time </font></font></p>
 
 <p align=LEFT><font face=Arial>The 'All Priests Look-a-like
 Competition' has come around again and Henry Sellers, host of the almost
 popular morning Quiz' is coming to judge it. Ted is determined to beat the
 priests from Rugged Island. Henry Sellers has a somewhat unfortunate sip
 of sherry which keeps the somewhat underemployed local policeman, Sergeant
 Deegan busy.</font></p>
 
 <p><font face=&quot;Comic Sans MS&quot; color=%23008000>Episode Five -
 <font color=%230080C0>And God Created Woman</font></font></p>
 
 <p align=LEFT><font face=Arial>Writer Polly Clarke comes to the
 island, Ted delivers his shortest mass ever, and is involved in an armed
 robbery!</font></p>
 
 <p><font face=&quot;Comic Sans MS&quot; color=%23008000>Episode Six -
 <font color=%230080C0>Grant Unto Him Eternal Rest</font> </font></p>
 
 <p align=LEFT><font face=Arial>Father Jack consumes a rather large
 quantity of floor polish, and unfortunately dies... Ted and Dougal have
 been left a fortune in his will... providing they allay his fear of being
 buried alive by spending a night with him in the crypt.</font></p>
 
 <p><u><font face=&quot;Comic Sans MS&quot; color=%23FF0000 size=+1>Series Two</font></u></p>
 
 <p><font face=&quot;Comic Sans MS&quot; color=%23008000>Episode One -
 <font color=%230080C0>Hell</font> </font></p>
 
 <p align=LEFT><font face=Arial>The priests annual holiday takes shape
 in the form of a stay at the Kilkelly Caravan Park. After visiting 'St
 Kevin's Stump' and 'The Magic Road', forever-talking Father Noel Furlong
 turns up wrecking their holiday plans.</font></p>
 
 <p><font face=&quot;Comic Sans MS&quot; color=%23008000>Episode Two -
 <font color=%230080C0>Think Fast, Father Ted</font> </font></p>
 
 <p align=LEFT><font face=Arial>Father Ted organizes are raffle in
 order to raise funds to repair the roof of the Parochial House. As there
 hasn't been a raffle on Craggy Island for over thirty years the priests
 manage to orgranise a car as the star prize. However perfectionist Ted
 tries to repair a small dent, and in turn trashes the whole car! An
 indentical car is borrowed from the Dancing Priest, however they rig the
 raffle so they win in order to return the car. The Dancing Priest dies;
 Father Jack crashes the car; and the roof doesn't get repaired!</font></p>
 
 <p><font face=&quot;Comic Sans MS&quot; color=%23008000>Episode Three -
 <font color=%230080C0>Tentacles of Toom</font> </font></p>
 
 <p align=LEFT><font face=Arial>The minuscule 'Holy Stone of
 Clanrichert' is after much consideration upgraded to a class II relic.
 Father Jack is taught to say other phrases apart from 'DRINK', 'FECK' and
 'ARSE', as three bishops arrive at the island in order to upgrade the
 stone. However one dies; one goes to hospital; and one becomes a hippy!</font></p>
 
 <p><font face=&quot;Comic Sans MS&quot; color=%23008000>Episode Four -
 <font color=%230080C0>The Old Grey Whistle Theft</font> </font></p>
 
 <p align=LEFT><font face=Arial>Headline news that Mr Bensons whistle
 has been stolen quickly spreads around the island. Sergeant Deegan orders
 the Police Area helicopter to Craggy Island in order to help find the
 culprit, which in the end is Dougal's new friend Father Damo.</font></p>
 
 <p><font face=&quot;Comic Sans MS&quot; color=%23008000>Episode Five -
 <font color=%230080C0>A Song for Europe</font> </font></p>
 
 <p align=LEFT><font face=Arial>Inspired by Dougal's Enthusiasm, and
 driven on by his rivalry Father Dick Byrne, Ted decides to enter the 1996
 Eurosong contest. Ted and Dougal 'borrow' a tune from an old Eurosong
 hopeful and enter it as their own. With inspired lyrics, a jaunty tune and
 the right attitude, they stand a good chance. But fate has one more card
 to deal.</font></p>
 
 <p><font face=&quot;Comic Sans MS&quot; color=%23008000>Episode Six -
 <font color=%230080C0>The Plague</font> </font></p>
 
 <p align=LEFT><font face=Arial>Rabbit-phobic Bishop Brennan pays a
 visit to investigate reports of Father Jack sleepwalking naked. Dougal has
 overrun the house with rabbits, which are multiplying fast and the priests
 have the task of keeping them away from Bishop Brennan, as well as keeping
 Jack in bed.</font></p>
 
 <p><font face=&quot;Comic Sans MS&quot; color=%23008000>Episode Seven -
 <font color=%230080C0>Rock-a-hula Ted </font> </font></p>
 
 <p align=LEFT><font face=Arial>Father Ted is asked to judge the
 'Lovely Girls' competition, Dougal gives away the Parochial house to Niamh
 Connolly and Jack is mistaken for Bob Geldof</font></p>
 
 <p><font face=&quot;Comic Sans MS&quot; color=%23008000>Episode Eight -
 <font color=%230080C0>Cigarettes, Alcohol and Rollerblading</font>
 </font></p>
 
 <p align=LEFT><font face=Arial>With Easter fast approaching, Dick
 Byrne suggests that he and Ted call a truce and get on with the important
 business of giving up something for lent. Ted gives up cigarettes, Dougal
 rollerblading and Jack drink. When they fall at the first hurdle. they ask
 assistance from Sister Assumpta, and a ten step road to spirituality is
 rigorously enforced.</font></p>
 
 <p><font face=&quot;Comic Sans MS&quot; color=%23008000>Episode Nine -
 <font color=%230080C0>New Jack City </font> </font></p>
 
 <p align=LEFT><font face=Arial>Jack has 'hairy hand sydrome' and is
 sent to St. Clabberts Home. However his replacement, Father Stack, is not
 to Ted's liking, due to the fact he plays loud jungle music constantly and
 does a whole host of things to annoy him. Eventually, Ted and Dougal go on
 a mission to retrieve Jack from the home and get rid of Father Stack.</font></p>
 
 <p><font face=&quot;Comic Sans MS&quot; color=%23008000>Episode Ten -
 <font color=%230080C0>Flight Into Terror</font> </font></p>
 
 <p align=LEFT><font face=Arial>The priests from Craggy Island end up
 being crammed into a plane with every other priest that has ever existed
 after a visit to the Shrine of Kinlettle. Dougal manages to empty the fuel
 tanks of the plane, and their only two parachutes to go round!</font></p>
 
 <p><u><font face=&quot;Comic Sans MS&quot; color=%23FF0000 size=+1>Christmas
 Episode</font></u></p>
 
 <p align=LEFT><font face=Arial>Ted, Dougal and a handful of other
 priests get lost in Ireland biggest lingerie department, while Jack is
 left a creche. Ted manages to get the priests out and is awarded a Golden
 Cleric for his services to the church. He then makes a speech conveying
 verbal abuse at the people who have done him down over the years.</font></p>
 
 <p><u><font face=&quot;Comic Sans MS&quot; color=%23FF0000 size=+1>Series Three</font></u></p>
 
 <p><font face=&quot;Comic Sans MS&quot; color=%23008000>Episode One -
 <font color=%230080C0>Are You Right There, Father Ted? </font> </font></p>
 
 <p align=LEFT><font face=Arial>Ted finally escapes to a new posting at
 Castlelawn Parochial House, Dublin, with civilisislanded company and
 frequent jaunts to Paris. Unfortunately a slight misunderstanding over
 some expenses sends Ted back to his old compadres on the island. After a
 spot of lad's housecleaning results in Ted being mistakenly tarred as a
 racist, Ted holds a celebration of Chinese culture to clear his name
 (though 'Kung Fu Fighting' might not have been an inspired choice of
 soundtrack). Just when it looks like a happy ending might be in store, a
 mix-up over some soft furnishings and Nazi memorabilia leaves the Chinese
 community with a sweet'n'sour taste in the mouth.</font></p>
 
 <p><font face=&quot;Comic Sans MS&quot; color=%23008000>Episode Two -
 <font color=%230080C0>Are You Right There, Father Ted? </font> </font></p>
 
 <p align=LEFT><font face=Arial>Ted bets the entire Parochial House
 heating budget on Chris the burping sheep, but can Ted stop him burping
 for 'King of Sheep 98'?</font></p>
 
 <p><font face=&quot;Comic Sans MS&quot; color=%23008000>Episode Three -
 <font color=%230080C0>Speed 3</font> </font></p>
 
 <p align=LEFT><font face=Arial>Mrs Doyle is tranformed into a giggling
 girl when the new milkman Pat Mustard visits the Parochial House. The
 transformation does not go undetected by Ted, who can barely disguise his
 dislike of Pat's overt sexuality. Ted decides to play at private detective
 to ensure that Pat's job is no more. Who is to replace the errant milkman?
 Step in Father McGuire to save the day, but an untold danger lies ahead.</font></p>
 
 <p><font face=&quot;Comic Sans MS&quot; color=%23008000>Episode Four -
 <font color=%230080C0>The Mainland</font></font></p>
 
 <p align=LEFT><font face=Arial>A trip to the mainland always leads to
 trouble, and Ted is deeply nervous at the prospect. What can possibly go
 wrong? Quite a lot actually! Ted's misgivings are justified as he has to
 bail Mrs Doyle, Mrs Dineen and Father Jack out of prison, not to mention
 being beaten up by Victor Meldrew on a tour of 'The Very Dark Caves', and
 Dougal nearly dying of malnutrition! Eventually a chance encounter with
 Father Noel Furlong leaves to Ted's pleasing Noel and his youth group 
 trapped under a large pile of rocks!</font></p>
 
 <p><font face=&quot;Comic Sans MS&quot; color=%23008000>Episode Five -
 <font color=%230080C0>Escape From Victory</font></font></p>
 
 <p align=LEFT><font face=Arial>It's the All-Priests Over-75s
 Five-A-Side Football challenge, and disaster looms when Ted's star player
 is nobbled by a bottle of Sleepy-Sleepy Nighty Snoozey-Snooze. Fortunately
 a pair of fake rubber arms and a remote-controlled wheelchair put our lads
 in with a chance of beating Dick Byrne this year. As long as they can fool
 the referee... </font></p>
 
 <p><font face=&quot;Comic Sans MS&quot; color=%23008000>Episode Six -
 <font color=%230080C0>Kicking Bishop Brennan Up The Arse</font></font></p>
 
 <p align=LEFT><font face=Arial>Ted looses a bet with Dick Byrne
 resulting in him having to kick Bishop Brennan up the arse!</font></p>
 
 <p><font face=&quot;Comic Sans MS&quot; color=%23008000>Episode Seven -
 <font color=%230080C0>Night of the Nearly Dead</font></font></p>
 
 <p align=LEFT><font face=Arial>Pop sensation Eoin McLove visits the
 priests, leading to hundreds of middle-aged ladies surrounding the
 Parochial House!</font></p>
 
 <p><font face=&quot;Comic Sans MS&quot; color=%23008000>Episode Eight -
 <font color=%230080C0>Going To America</font></font></p>
 
 <p align=LEFT><font face=Arial>Ted is given the chance to become a
 priest in a parish in California, however how can he break the news to
 Dougal, Jack and Mrs Doyle</font></p>
