<p align=center><font size=5><strong>W</strong></font><font size=4>elcome to the
Bury &amp;amp; District Pool League</font></p>
<p align=center><font size=5>T</font><font size=3>he league has been running since
1977, and now has 6 divisions. Each division contains 12 teams which play each other twice
during the season. Our winning teams and winners of Knockout Competitions are shown in the
annually published <strong>Bury &amp;amp; District Pool League</strong> book {from 1978
onwards}.</font></p>
<p align=center><font size=5>W</font><font size=3>e are always looking for
sponsorship for the competitions, so if you would like you name/company name printed in
over 1000 books yearly, let me know and we will sort something out with yourselves.</font></p>
