<p align=center><big><em><u>Welcome to the Performance Cars.....Dream Cars Home Page</u></em></big></p>
<p align=center>Within this site I am hoping you will be able to find information on the
fastest, best looking cars on the planet.&amp;nbsp; I don't mean customised cars, because they
are designed to suit each individuals taste.&amp;nbsp; But production cars that are built to
thrill, to excite, and to explode onto todays ever populated roads.&amp;nbsp; I will
concentrate mainly on the cars of today, but some of the fastest, best looking cars were
created quite a number of years ago.&amp;nbsp; A lot of todays styling goes back to the
sixties when petrol guzzling muscle cars was on the minds of every man that could drive
and quite a lot of them that couldn't!</p>
<p align=center>&amp;nbsp;</p>
<p align=center>Please enjoy your viewing and remember to send comments or request for
any pictures to <a style=background-color:rgb(0,0,0);color:rgb(255,255,255) href=mailto:SGough@btinternet.com>SGough@btinternet.com</a></p>
<p align=center>&amp;nbsp;</p>
<p align=center>I will make this list grow as fast as I can. Meanwhile, if there are any
cars you do not see, but consider to be a <em>performance car</em>, let me know and I will
see what I can do<small>.</small></p>
