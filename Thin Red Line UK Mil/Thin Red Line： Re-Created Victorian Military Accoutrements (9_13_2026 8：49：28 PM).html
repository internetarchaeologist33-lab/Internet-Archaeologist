 <p><b>ISSUE 2 </b><br>
 Due to the growing popularity and the increased size of the second issue 
 of &quot;Regimental Orders&quot; we felt that compressing the document 
 for web publication was not going to do it justice and, therefore we have 
 decided to provide the second issue on CDRom.</p>
 <p>This second issue contains 24 pages of indepth information and some excellent 
 uniform photographs. On this page you will see some screen shots from 
 this issue.</p>
 <p>If you would like to subscribe to future issues please download and complete 
 the <a href=http://www.users.globalnet.co.uk/~thinred/regimental/form.htm><b>application form.</b></a> For a subscription 
 of £6 or USD10 you will receive two issues in PDF format. We suggest 
 that our overseas subscribers send actual dollars by registered mail as 
 UK banks do not accept foreign checks.</p>
 <p> We will be glad to receive any articles, large or small, on the subject 
 of Victorian uniforms or equipment and look forward to your support. This 
 is your opportunity to help bring together everyone who has an interest 
 in our subject and to make us one large worldwide club!! </p>
 <p>If you would prefer to receive the printed or the CDRom versions we are 
 showing the subscription rates below.</p>
