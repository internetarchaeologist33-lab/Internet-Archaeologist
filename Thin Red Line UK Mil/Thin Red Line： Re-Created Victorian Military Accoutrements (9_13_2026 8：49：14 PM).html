<p align=center> In this year of H.M. Queen Elizabeth's Jubilee, and on the 
 weekend of 28th - 29th June, the South Wales Borderers Museum in Brecon, Mid-Wales, 
 held a Golden Jubilee Summer Fair. The theme of the fair was the Anglo-Zulu 
 War of 1879 as the famous 24th Foot were, of course, the predecessors of the 
 South Wales Borderers.<br>
 Situated alongside Brecon Barracks, which is now the headquarters of 160(Wales) 
 Brigade, the South Wales Borderers Museum in Brecon is a must for anyone interested 
 in the Zulu War, and contains many fine examples of uniforms and accoutrements 
 of the whole Victorian period. Although not a large museum, it has a certain 
 intimacy and visitors are assured of a warm Welsh welcome. During the weekend 
 fair a number of Zulu War campaign documents, not normally displayed, were on 
 show. The famous author of countless books on the Zulu War, Ian Knight, was 
 present to give twice daily lectures. Original paintings and prints by Jason 
 Askew were displayed and on sale, and Bill Cainan displayed his amazing and 
 incredibly detailed model of Rorke's Drift.<br>
 The 1879 Group were well represented and were able to provide an authentic atmosphere 
 for visitors. As well as members representing the infantry, Surgeon -Major &quot;Slasher&quot; 
 Morgan was on hand to demonstrate Victorian field hospital techniques and equipment 
 - not for the faint-hearted!<br>
 Thin Red Line's new home in mid-Wales is only some 25 miles from Brecon, so 
 it was an easy matter to attend both days with a small display of uniforms and 
 equipment relevant to the Zulu War. We all enjoyed ourselves immensely at an 
 informal and relaxed weekend and the pictures show the 1879 Group together with 
 Ian Knight and Yours Truly at the Thin Red Line stand.<br>
 Visit the archive section of our website for news of past 1879 Group events 
 at Brec
on and see their website from our Links Page<br>
 Keith Perks</p>
