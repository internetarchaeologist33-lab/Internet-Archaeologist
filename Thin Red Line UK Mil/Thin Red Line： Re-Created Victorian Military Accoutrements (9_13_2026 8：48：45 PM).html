 Welsh Regiment and colours were paraded by a colour party from the Powys Army
 Cadet Force who are shown below. The Powys cadets were joined by the 1879 Group's
 youngest recruit -Chris John -who, as bugler, had called all assembled guests
to the dining room with the appropriate bugle call.</p>
