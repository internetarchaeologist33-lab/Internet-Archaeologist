 <p align=center>&amp;nbsp;&amp;nbsp; The Thin Red Line exhibition of British Victorian
 uniforms, is currently on display at the Radnorshire Museum in Llandrindod
 Wells, Powys, Wales.<br>
The exhibition will be at the museum until March 2003 after which it will be
on permanent display at our own premises<br>
We are showing below some photos of the line up, and pictures with accompanying
text may also be found in the &quot;Uniform Museum&quot; section of our website.
In the forefront of our photos you can see the famous 13th century log boat which
was found locally. For further information contact the museum at <a href=mailto:radmus@ntmail.powys.gov.org>radmus@ntmail.powys.gov.org</a></p>
