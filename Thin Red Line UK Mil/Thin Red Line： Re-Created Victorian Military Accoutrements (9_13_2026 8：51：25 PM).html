<p align=CENTER> <b>VICTORIAN SOLDIERS FERRIED TO GARRISON DUTIES ON GUERNSEY</b></p>
<center>
 <table width=540 border=0 cellpadding=4>
 <tbody><tr> 
 <td> 
 <p class=MsoNormal><span lang=EN-GB style=font-size:12.0pt>On Thursday 
 27<sup>th</sup> April 2000 Brian Owen, Social History Officer at Guernsey 
 Museum crossed by overnight ferry from the Channel Island of Guernsey 
 to Portsmouth. He was driving a large empty white van</span></p>
 <p class=MsoNormal><span lang=EN-GB style=font-size:12.0pt>On arrival 
 at Portsmouth very early the next morning he ate a quick breakfast and 
 then drove some 40 miles to New Milton in the New Forest where he was 
 to collect a rather unusual cargo. Awaiting him, dressed in various 
 regimental uniforms, were the 16 life-size dummies which form the Thin 
 Red Line collection of Victorian Military uniforms. They were destined 
 for display at Castle Cornet, the ancient castle that guards the entrance 
 to St Peter Port harbour in Guernsey. During the Victorian era and before, 
 many, if not most, British regiments had been posted to garrison duties 
 at Castle Cornet, but these were the first Victorians to take up that 
 posting since the passing of the great queen!</span></p>

 <p class=MsoNormal align=center> <i>Some of the assembled troops ready 
 for embarkation and awaiting transport </i></p>
 <p class=MsoNormal><span lang=EN-GB style=font-size:12.0pt>The hitherto 
 empty white van was loaded with the troops without too much ceremony, 
 some having helmets or other equipment removed for ease of access, and 
 was driven to the nearby ferry terminal at Poole. Brian Owen now had 
 the human (some say)company of Keith Perks for the return journey to 
 Guernsey. After a very painless and very high speed crossing taking 
 only just ove
r two hours in the amazing Condor catamaran ferry, we berthed 
 at St Peter Port and drove the short distance to Castle Cornet. For 
 yours truly, this day had been the culmination of a week or so of very 
 frantic activity preparing all the dummies after their off-season storage, 
 and it came as rather a nasty surprise when Brian announced that we 
 would have to unload our cargo that evening, and that their new home 
 was situated high up inside the castle with no easy access. A compromise

 <p class=MsoNormal><span lang=EN-GB style=font-size:12.0pt>The next 
 morning, an early start was made and one by one all the dummies and 
 their accoutrements were carried up the steep paths and stone steps 
 leading to the terrace containing the old 18th century Hospital building. 
 which was to contain the exhibition From this level the views over the 
 harbour and town were breath-taking but not 
as breath-taking as the 
 climb up to that level whilst carrying a full-size dummy! After working 
 all day Saturday and Sunday morning, we eventually stood back and felt 
 quite proud of the overall result of our labours. The museum's technical 
 support department had produced some superb signage to accompany the 
 exhibition and the whole effect was very pleasing.</span></p>
 <p class=MsoNormal>Always on the lookout for an opportunity to wear my
 1895 Royal Welsh Fusilier major's uniform, I had been invited to take
 part in the noon gun firing ceremony. This takes place precisely at
 noon each day, and is performed by Castle attendants wearing replica
 uniforms of the Guernsey Militia which were coincidentally supplied
 by Thin Red Line! After some quick discussion, a scenario was agreed,
 and I became Inspecting Officer of the Firing Party for the day. This
 was great fun and seemed to go down very well with our audience of
