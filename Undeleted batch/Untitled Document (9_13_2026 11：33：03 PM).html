<h3><a name=ancUpcomingCourses></a> Upcoming Courses</h3>
&amp;lt;%25
Set oConn=Server.CreateObject(&quot;ADODB.Connection&quot;)
Set oRS=Server.CreateObject(&quot;ADODB.Recordset&quot;)
oConn.Open gblConnectString
oRS.Open &quot;SELECT * FROM tblCourses WHERE [strCourseStatus]='U'ORDER BY [dteCourseDate] DESC&quot;, oConn
Do While not(oRS.EOF)
%25&amp;gt;
<table width=99%25>
 <tbody><tr> 
 <td colspan=5><b>Title: <u>&amp;lt;%25Response.Write oRS(&quot;strCourseTitle&quot;)%25&amp;gt;</u></b></td>

 day(s)</td>
 </tr>

 <td colspan=4 height=28>&amp;lt;%25Response.Write oRS(&quot;memCourseAgenda&quot;)%25&amp;gt;</td>

<br>
&amp;lt;%25oRS.MoveNext
Loop
%25&amp;gt;
