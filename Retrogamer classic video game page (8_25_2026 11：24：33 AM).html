<font color=%23000000 face=&quot;Verdana, Arial, Helvetica, sans-serif&quot; size=-1><i>Welcome to the <b>RETROGAMER</b> web site!</i> Thanks for visiting, I hope it jogs some nostalgic memories.</font><p></p>
 <font color=%23000000 face=&quot;Verdana, Arial, Helvetica, sans-serif&quot; size=-1> 
 So what is this site all about? RETROGAMER is a <i>printed fanzine</i> 
 published in Liverpool, UK which is dedicated to classic video games. 
 The zine's definition of classic is any old game (basically 8-bit 
 and 1980's) that made you forget the time or ate all your money 
 at the arcade. 
 <p> The editor of RETROGAMER, <b>Keith Ainsworth</b>, also wrote 
 the monthly retro page in professional UK magazine <b>Computer 
 and Video Games</b> through 1998. He has also appeared on <b>BBC 
 television</b> talking about the coin-op <i>Space Invaders</i>.
 <p>
</p><center>
<img src=data:,>
</center><p>
<p align=center><font size=-1 face=&quot;Verdana, Arial, Helvetica, sans-serif&quot;><b><i><font size=-2>Keith Ainsworth</font></i></b></font></p>
RETROGAMER covers video game consoles, home computers and the coin-ops themselves. It has features on the companies who made the games, the individuals who programmed them and articles on popular games and series of games.
 <p> Retrogamer is the best retro read around. A complete set will

right <a href=https://www.oocities.org/siliconvalley/heights/5874/ultimate.htm><b>here.</b></a>
</font><p><font color=%23000000 face=&quot;Verdana, Arial, Helvetica, sans-serif&quot; size=-1>
For the details of what has been in each issue of RETROGAMER go to the the <a href=https://www.oocities.org/siliconvalley/heights/5874/back.htm><b>back issues</b></a> section.
</font><p><font color=%23000000 face=&quot;Verdana, Arial, Helvetica, sans-serif&quot; size=-1>
</font>
<font size=+1><b>Reviews</b></font><p>
<p><font color=%23000000 face=&quot;Verdana, Arial, Helvetica, sans-serif&quot; size=-1>
Who says <b>RETROGAMER</b> is the best retro mag? Loads of people! There have been many excellent reviews in the professional game press. Here are five example reviews for you to peruse. <b><i>NMS</i></b> (Nintendo Magazine System) changed it's name slightly to <b><i>Nintendo Magazine</i></b> when the N64 was released, the reviews are from the <a href=https://www.oocities.org/siliconvalley/heights/5874/nmsjan96.htm><b>January 96</b></a>, <a href=https://www.oocities.org/siliconvalley/heights/5874/nmsapr96.htm><b>April 96</b></a> and <a href=https://www.oocities.org/siliconvalley/heights/5874/nmsaug96.htm><b>August 96</b></a> issues. The <a href=https://www.oocities.org/siliconvalley/heights/5874/superpla.htm><b><i>Super Play</i></b></a> review (sadly they're no longer with us) is from Jan 96 and the <a href=https://www.oocities.org/siliconvalley/heights/5874/n64mag.htm><b><i>N64 Magazine</i></b></a> review from February 1998.
</font><p><font color=%23000000 face=&quot;Verdana, Arial, Helvetica, sans-serif&quot; size=-1>
</font>
<font size=+1><b>Credits</b></font><p>
<p>
 <font color=%23000000 face=&quot;Verdana, Arial, Helvetica, sans-serif&quot; size=-1> 
 RETROGAMER has had a home on the web since 1996. The contents of 
 this site are copyright Keith Ainsworth. Keith wrote all the words 
 and produced most of the pictures. The design and look of this site 
 is by William Chiu at Connect (wchiu@connect.org.uk). The original 
 version of this site was coded by Mark Ramsay and bits of his work 
 may still be present. 
 </font><p><font color=%23000000 face=&quot;Verdana, Arial, Helvetica, sans-serif&quot; size=-1> The &quot;pictures from the collection&quot; were created by scanning 
 some high quality photographs taken by Denis Shiel. Below is a 
 pic of Denis acting perfectly normal. You can contact him on <a href=&quot;mailto:dshiel@hotmail.com?Subject=RetrogamerMail&quot;> 
 <strong>dshiel@hotmail.com</strong></a> 
</font><p><font color=%23000000 face=&quot;Verdana, Arial, Helvetica, sans-serif&quot; size=-1> 
</font></p><center><font color=%23000000 face=&quot;Verdana, Arial, Helvetica, sans-serif&quot; size=-1>
 <p><img src=data:,> </p>
 <hr noshade>
 <p>Thanks to everyone who contributed to RETROGAMER in the 
 last 5 years. Their enthusiasm and knowledge is what made it 
 the best. If you have any suggestions on how to improve this 
 site please let me know. Any comments or questions please e-mail 
 me at <a href=&quot;mailto:keithainsworth@hotmail.com?Subject=RetrogamerMail&quot;> 
 <strong>keithainsworth@hotmail.com.</strong></a> Write now and 
 I'll get back to you within two days. </p>
 <p> 
 <p><font color=%23000000 face=&quot;Verdana, Arial, Helvetica, sans-serif&quot; size=2>To 
 finish off I'll just give you <i>the meaning of life</i>.</font></p>
 <p><font color=%23000000 face=&quot;Verdana, Arial, Helvetica, sans-serif&quot; size=-1> 
 Happiness is derived from four points... </font></p>
 <p><font color=%23804040 face=&quot;Verdana, Arial, Helvetica, sans-serif&quot; size=-1>1.Satisfying 
 work</font></p>
 <p><font color=%23FFFF80 face=&quot;Verdana, Arial, Helvetica, sans-serif&quot; size=-1>2.Satisfying 
 Leisure </font></p>
 <p><font color=%23000080 face=&quot;Verdana, Arial, Helvetica, sans-serif&quot; size=-1>3.A 
 strongly supportive social network </font></p>
 <p>
 <p><font color=%2380FFFF face=&quot;Verdana, Arial, Helvetica, sans-serif&quot; size=-1>4.Being 
 extrovert and positive</font></p>
 <p>&amp;nbsp;</p>
 <font color=%23000000 face=&quot;Verdana, Arial, Helvetica, sans-serif&quot; size=-1>
 <p> Peace
 <p><i>Happy Gaming!!!</i>
 <p>&amp;nbsp; 
 <p>
Keith Ainsworth 2001</p></font>
