<p><font color=%23FF0000 size=4><strong>Siting for Touring
Caravans.</strong></font></p>
<table border=0 cellpadding=10 cellspacing=0 width=100%25>

 <td valign=top style=text-align:justify;padding-left:6;padding-right:6;padding-top:10><p align=left><font color=%23000000><strong>We have
 facilities for occupants of touring caravans, who are
 welcome to use&amp;nbsp; the numerous facilities offered at
 our park. Centrally heated toilets and shower block
 situated on the park. The park is well suited for
 tourists and is easily accessible by all routes. We are a
 family run establishment situated some 200 yards from the
 beach and close to the Fantasy Island Complex and
 Markets. We regret that we are unable to accept tents,
 and parties of all male / female groups.</strong></font></p>
