 <td valign=top width=50%25 style=text-align:justify;padding:10><font color=%23000000 size=4><strong>GOLDEN BEACH</strong></font><font color=%23000000><strong> holiday park is situated in
 Ingoldmells resort, which is about 3 miles to the north
 of Skegness. The whole area is a constant hive of
 activity, where you will find an abundance of day time
 amusements, fantastic night life, miles of golden beaches
 (just across the road), and much more. There is perhaps
 no better venue for a family holiday or sea side break.
 We offer both caravan or bungalow accommodation.</strong></font></td>

 <td width=100%25 style=text-align:justify><font color=%23000000><strong>Our location is ideal for all of
 the local attractions, including Butlins Family
 Entertainment Resort, Fantasy Island, and all that
 Ingoldmells has to offer. Not forgetting that our
 visitors are welcome to enjoy free membership at the Club
 situated on an adjacent site, where your family are
 welcome, and you can fully relax in the evenings just a
 short distance from your holiday home.</strong></font><p><font color=%23000000><strong>All accommodation can be let on a
 nightly basis (min. 3 nights) with the exception of Bank
 Holidays, and 22nd July to 4th September. Shorter breaks
 may be arranged subject to availability - please enquire
 at the telephone number or email link below for the
 latest information and availability.</strong></font></p>
 <p><font color=%23000000><strong>We greatly regret that
 strictly we do not allow dogs or pets. Golden Beach Park
 is a family oriented venue, and as such, we cannot accept
 reservations from parties of all male / female groups.<br>
 .</strong></font></p>
