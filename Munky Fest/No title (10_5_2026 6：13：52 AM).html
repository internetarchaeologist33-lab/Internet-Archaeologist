 <td><p align=CENTER><font color=%23000000 face=&quot;Courier New,Courier&quot;><tt>MONKEYFEST - A MAJOR SUCCESS 16th July 1999<br><br></tt></font><font face=&quot;Courier New,Courier&quot;><tt>As the clouds cleared and the rain turned to glorious sunshine, the stage was set for Monkeyfest 99. The night kicked off with Si’s white noise set - an MK keyboard, a Nic Endo record and Si entertains us with ten minutes of hell-raising accompanied by various bossa nova and disco beats. Then The Fucks come on stage for their first reunion gig since the three day split. Pure genius - they rename themselves El Fuckos. The highlight of the set being Will singing Bad Religion’s ‘You’, and me sessioning on the MK. Then The Honey Shop Screamers deliver a blinding set despite the drum stage collapsing and, similarly, they are followed by us, The Splitpins, playing our usual blend of punk-rock harmonies despite the PA system going down. Chaos, on and off stage, like has never been seen at a Splitpins’ gig yet ensues - it’s brilliant. Finally The Handy Jackoffs manage to, from a collapsed stage and with a bust PA, entertain us with their beautiful brass enriched ska, and Paul Rafferty gives an official warning that his bike gang WILL be taking to the streets at weekends this summer. A chaotic version of Rancid’s ‘Roots Radical’ played by all four bands brings the evening’s entertainment to a close. Chris threatens the leaving guests with his ‘blades’ and John sings ‘Copacabana’. And, of course, none of this could have taken place without our host for the evening, loved and respected by all the bands and all the fans, Will Dison. Or El Will as he now wishes to be known.<br><br>Joe, Summer 99<br></tt></font>&amp;nbsp;</p></td>
