<div style=text-align:CENTER><font size=2 color=%23000000 face=Arial,Helvetica,sans-serif>Kelly Shank pictured here is working in the men's dorm. The white walls you see</font></div>
<div style=text-align:CENTER><font size=2 color=%23000000 face=Arial,Helvetica,sans-serif>was the project he was working on. Those walls gave each man his own space.</font></div>
<div style=text-align:CENTER><font size=2 color=%23000000 face=Arial,Helvetica,sans-serif>We found that most people seem to take more pride in themselves and felt better </font></div>
<div style=text-align:CENTER><font size=2 color=%23000000 face=Arial,Helvetica,sans-serif>about their plan and working when they had something they could call there own.This</font></div>
<div style=text-align:CENTER><font size=2 color=%23000000 face=Arial,Helvetica,sans-serif>picture is phase two, the half way point of the project.</font></div>
