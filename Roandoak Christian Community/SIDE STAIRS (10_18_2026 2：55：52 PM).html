<div><img border=0 src=data:image/gif;base64,R0lGODlhAQABAID/AMDAwAAAACH5BAEAAAAALAAAAAABAAEAAAEBMgA7 height=11 align=bottom width=1 hspace=0 vspace=0></div>

<div align=LEFT></div>
<div style=text-align:CENTER><font size=2 color=%23000000 face=Arial,Helvetica,sans-serif>All the lumber used on this project were from the profits from the wood shop sales.</font></div>
<div style=text-align:CENTER><font size=2 color=%23000000 face=Arial,Helvetica,sans-serif>Also notice the roof off, that happened in a storm last year. It also took 2/3 of the barn roof off.</font></div>
<div style=text-align:CENTER><font size=2 color=%23000000 face=Arial,Helvetica,sans-serif>The section missing here was found in the field in the back of the barn in one piece.</font></div>
<div style=text-align:CENTER><font size=2 color=%23000000 face=Arial,Helvetica,sans-serif>Now if you're an old timer of ROANDOAK you may remember that the walk way use to go all the way across the side here that too was a project we had to lift the upper story and replace the rotten beams</font></div>
<div style=text-align:CENTER><font size=2 color=%23000000 face=Arial,Helvetica,sans-serif>with fresh wood and where the floors were, the wall sections also had to be ripped out and replaced.</font></div>
<div style=text-align:CENTER><font size=2 color=%23000000 face=Arial,Helvetica,sans-serif>And then we found some left over tile and gave the building a face lift.</font></div>

<div>
All the lumber used on this project were from the profits from the wood shop sales.</div>
<div>

<div>

<div>
Now if you're an old timer of ROANDOAK you may remember that the walk way use to go all the way across the side here that too was a project we had to lift the upper story and replace the rotten beams</div>
<div>
with fresh wood and where the floors were, the wall sections also had to be ripped out and replaced.</div>
<div>
