 <div><font size=2 color=%23000000 face=Arial,Helvetica,sans-serif>ROANDOAK OF GOD &amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;| &amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;<a href=https://community.fortunecity.ws/marina/customhouse/1435/index.htm target=_top title=&quot;ROANDOAK OF GOD&quot;><u>home</u></a></font></div>
<div><font size=2 color=%23000000 face=Arial,Helvetica,sans-serif>&amp;nbsp;OCTAGON TABLE </font></div>

<div><font size=2 color=%23000000 face=Arial,Helvetica,sans-serif>This is the 6' foot octagon table that has been completed and ready for shipment.These tables come in three sizes 10' 0&quot;- 8 ' 0&quot; and the one shown is our 6' 0&quot;. The wood used is con-heart about 16 hundred board feet, 32 carriage bolts, 60- 3&quot;in. drywall screws. Each piece has been planed, routed, sanded and finished with the stain of your choice at no extra cost. Please allow 30 days we don't want to rush your order. We find that if we take our time on each piece, our customer is much happier. Our shop is very small and we build each order one at a time to insure quality. Please note we do not set a price because the lumber market never stays the same and we try to use the best redwood we can find so we find ourselves going to different lumber yards if the quality of wood doesn't meet our standards. To date this table has sold from $300.00 max. to a low of $270.00 If we feel that an item we build goes above the quoted price we will contact you for your approval. But the best way is a customer poll where we contact our customers and seek their advice.</font></div>

<div>
This table comes in 6 sizes.</div>
<div>
This is the 6' foot octagon table that has been completed and ready for shipment.These tables come in three sizes 10' 0&quot;- 8 ' 0&quot; and the one shown is our 6' 0&quot;. The wood used is con-heart about 16 hundred board feet, 32 carriage bolts, 60- 3&quot;in. drywall screws. Each piece has been planed, routed, sanded and finished with the stain of your choice at no extra cost. Please allow 30 days we don't want to rush your order. We find that if we take our time on each piece, our customer is much happier. Our shop is very small and we build each order one at a time to insure quality. Please note we do not set a price because the lumber market never stays the same and we try to use the best redwood we can find so we find ourselves going to different lumber yards if the quality of wood doesn't meet our standards. To date this table has sold from $300.00 max. to a low of $270.00 If we feel that an item we build goes above the quoted price we will contact you for your approval. But the best way is a customer poll where we contact our customers and seek their advice.</div>
