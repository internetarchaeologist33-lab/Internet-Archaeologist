<div style=text-align:CENTER><font size=2 color=%23000000 face=Arial,Helvetica,sans-serif>These are just a few of the many children that have made ROANDOAK their home over the years. Over the past twenty five years many kids like these remember the good times they had when they lived on the commune and even today from time to time they still drop in to say hi and tell us the stories of what it was like when they grew up on the commune, god is good</font></div>
