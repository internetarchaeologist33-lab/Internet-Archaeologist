<p>Dear viewers.</p>
<p>&amp;nbsp; With over 400 e-mails in 16 days,&amp;nbsp; I have been
truly overwhelmed by the response to my new site. I have tried
were possible to respond personally to all of you that e-mailed
me. If&amp;nbsp; how ever I have over looked any one&amp;nbsp; please
accept my apologies. I am presently working a 50 hour week, and
with a home to run spare time to manage this site is at a
premium. The cost to you at the moment is nothing, so all I ask
is your patience, indulgence and understanding.</p>
<p>&amp;nbsp; Below you will find some pictures with text. It is my
way of answering some of your questions and requests. Please view
and enjoy.&amp;nbsp;</p>

<p align=center>Plenty of you of there, seem to like to see me
in waders. So, on with the boots and off to work I go.</p>
<p align=center><font size=4><u>Closing thought for this
month.</u></font></p>
<p align=center><i>&amp;nbsp;</i>I realise that I am not going to
please all of you all of the time. But over the passage of time,
I will&amp;nbsp; hopefully try and please most of you some of the
time.</p>
<p align=center>Once again, and as always, my heart felt thanks
to Mirador and Slippy for their input and assistance in producing
this site.</p>
<p align=center>To all of you out there, have a great month
till my next update in October...........Pippa.</p>
