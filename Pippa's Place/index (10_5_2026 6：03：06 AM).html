<p align=center><font size=5><u>Closing Thoughts</u></font></p>
<p align=left><font size=3>To all that have viewed my pages. I hope you have
enjoyed them. I realise that I will not win any awards for best web
site.&amp;nbsp;&amp;nbsp;&amp;nbsp; I am under no elusions about being a super model.
All I have tried to do is put up a few pictures of me enjoying myself in various
situations.</font></p>
<p align=left><font size=3>&amp;nbsp; I ask of you one thing. If you are going
to make a comment to me by e-mail, think before you put your fingers on the key
board. I have spent a considerable amount of&amp;nbsp; time, effort and money in
putting this small site
together.&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;</font></p>
<p align=left><font size=3>TIME:&amp;nbsp; in hours spent on location taking the
pictures and formatting the site. Plus going round the shops looking
for the gear to wear and sorting out locations to take the pictures.</font></p>
<p align=left><font size=3>EFFORT: A 4 mile round trip walk to the
isolated locations where the pictures were taken, and every thing we needed for
the days shoot had to be carried there and back. Between 160 lbs and 180 lbs of
gear, and don't for get it weighs heavier on the way back as every
thing is wet and caked in mud. And once home it all as to be washed and cleaned.</font></p>
<p align=left><font size=3>MONEY: I am sure many of you out there will
appreciate how much the gear you have seen will have cost and what you have seen
is probably only one tenth of my wardrobe. I have an expensive interest.</font></p>
<p align=left><font size=3>&amp;nbsp; So to the POINT, What I don't want is some
rampant little clever dick asking me out for a wild 10 mins. of what he may
consider fun or any impolite suggestions. If there are any they will be treated
with the contempt they deserve and will be ignored. But I will respond
personally to all reasonable correspondence, and if you have any suggestions for
further shoots I would love to hear them. I won't guarantee to be do them but I
will consider them.</font></p>
<p align=left><font size=3>&amp;nbsp; Finally I am in a bit of a quandary. I have
really enjoyed putting this small site together and feel I would like to take it
further. I have an extensive archive of photographs but am unsure as to how to
proceed.&amp;nbsp; I have an idea for a subscription only site. What do you
think?&amp;nbsp; I would welcome your views and suggestions.</font></p>
<p align=left><font size=3>&amp;nbsp;&amp;nbsp;&amp;nbsp; Thank you in advance........Pippa.</font></p>
