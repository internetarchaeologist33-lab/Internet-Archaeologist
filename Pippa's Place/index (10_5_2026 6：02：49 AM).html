<p>Welcome to Octobers issue. It's been a very busy month for me, and I have
only managed one trip out to the bay. The results of which you can see
below.&amp;nbsp; I had a great deal of fun doing this particular shoot, and I hope
you enjoy viewing them as much as I did producing them.</p>
<p>In Novembers issue, their will a lot of changes taking place. The format of
the site, a new web address, and hopefully I will be making the purchase of a
photo album available.</p>

 <td>So, with the mud not being so deep I decided to have a roll around in
 it instead. It's quite a pleasurable experience, as those of you that
 have tried it will testify.
 <p>Their is nothing nicer than slithering around in the mud, and it does
 have medical benefits......it's good for the skin. To think, woman pay
 hundreds of pounds, or dollars, to go to health farms just to wallow in
 a mud bath. This is free, and it's far more fun.</p>
 <p>I only wish I could tape the sounds that are being made as I am
 rolling, slithering and slopping around in the mud. I am sure many would
 find the sounds very erotic, not that I am saying I do....... ;-)</p></td>

<p>&amp;nbsp;I am sorry it is only a one page up date this month. My day job as
taken up a lot of time this month, and that's what puts the bread and butter on
the table. Also I have been down with the flu, and that's not as good as being
down in the mud,&quot; believe me.&quot;</p>
<p>&amp;nbsp;October is going to see a lot of changes taking place, hopefully. Next
week end, 7th &amp;amp; 8th October is going to be rather special. I have a visitor
coming from the States. Some of you may know him, and his work. I can not tell
you much more at the moment, but it should mean that I am going to have a photo
shoot published in a couple of magazines. I will tell you more next month.</p>
<p>&amp;nbsp;I would like to finish off with what&amp;nbsp; I will call my &quot;
thought for the month&quot;. If any of you out there would like to send me
yours, I will pick one for the end of next months update. I call it, &quot;A
prayer for the stressed&quot;</p>
<p>&amp;nbsp; Grant me the serenity to accept the things I cannot change, the
courage to change the things I cannot accept, and the wisdom to hide the bodies
of those I had to kill today because they got on my nerves. And also, help me to
be careful of the toes I step on today as they may be connected to the feet I
may have to kiss tomorrow. Help me to always give 100 %25 at&amp;nbsp;
work............12%25 on Monday......23 %25 on Tuesday...... 40 %25 on
Wednesday......20 %25 on Thursday.......and&amp;nbsp; 5%25 on Friday. And also help me
remember........When I am having a bad day and it seems that people are trying
to wind me up, it takes 42 muscles to frown, 28 to smile and only 4 to extend my
arm and smack some one in the mouth.</p>
<p>&amp;nbsp; Till next month, take care, be good and most importantly have fun and
keep smiling.&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; Pippa.</p>
