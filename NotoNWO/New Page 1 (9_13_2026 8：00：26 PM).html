<p align=center><font color=%230000FF>Today was a total trail day, all day long! Last
time I posted was January 9th. Between then and February 9th I only took two pictures.
Trails were vurtually non-existant in this part of New Jersey. I am in the direct flight
path of some/many planes coming and going to Newark International Airport. So, if trails
are normal, did they take a vacation for a whole month? We had some snow fall so it is not
like there were no storm fronts moving through and for damned sure the weather has been
cold, cold and then even more cold. Prime conditions for them &quot;ice crystals&quot;
(real contrails) but they were no where to be seen until the past few days. I am going to
post only pictures from today 2-17-00 on this page and hopefully will put up a link soon
to other pics from the past few days AND the next few days.</font></p>
