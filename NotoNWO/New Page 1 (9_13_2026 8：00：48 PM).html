<p align=center><font face=&quot;Arial Black&quot; color=%230000FF><big><strong>I took the family

is what you see in this pic. But, as the plane exited the cloud cover (which looked like
older spread out trails) the trail began again. I couldn't snap a pic of the cloud exit as
I was moving and we were in a rush to get things done before dark.</strong></big></font></p>
